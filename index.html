<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/logo.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Parties by Tali: themed sleepover tent experiences with Pretty in Pink, Camp Slumberwood, Let's Glow Crazy, Game On, and Cozy Christmas packages."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Parties by Tali | Themed Sleepover Experiences</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Netlify Forms: static form so the build detects fields for SPA submits -->
    <form
      name="booking"
      action="/__forms.html"
      method="POST"
      netlify
      data-netlify="true"
      data-netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="booking" />
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="eventDate" />
      <input type="text" name="guests" />
      <input type="text" name="theme" />
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
